name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexLinkRouter
          path: |
            dist/YandexLinkRouter-Setup.exe
            dist/ymrouter.exe
            dist/YandexLinkRouter-*.zip
          if-no-files-found: error

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YandexLinkRouter-Setup.exe
            dist/YandexLinkRouter-*.zip
